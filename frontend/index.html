<!DOCTYPE html>
<html lang="en">

<head>
    <title>Recurring Appointments</title>
    <meta charset="UTF-8" />
</head>

<body>

    <h1>Generate Calendar</h1>

    <!-- Container for all sequences -->
    <div id="sequences-container">
        <!-- A single "sequence block" will be cloned from this template -->
        <div class="sequence-block" style="border: 1px solid #ccc; margin-bottom: 1em; padding: 1em;">
            <label>
                Appointment Names (comma-separated):
                <input type="text" class="appointment-names" placeholder="Appointment 1, Appointment 2" />
            </label>
            <br /><br />
            <label>
                Start Date:
                <input type="date" class="start-date" />
            </label>
            <br /><br />
            <label>
                End Date:
                <input type="date" class="end-date" />
            </label>
            <br /><br />
            <label>
                Recurrence Interval (days):
                <input type="number" class="interval-days" value="14" />
            </label>
        </div>
    </div>

    <!-- Button to add new sequence blocks -->
    <button id="add-sequence-btn">Add Another Sequence</button>
    <br /><br />

    <!-- Calendar name input -->
    <label>
        Calendar Name:
        <input type="text" id="calendar-name" placeholder="recurring_appointments" />
    </label>
    <br /><br />

    <!-- Submit button to POST data to FastAPI -->
    <button id="submit-btn">Generate Calendar</button>

    <script type="text/javascript" src="read_inputs.js"></script>

</body>

</html>
